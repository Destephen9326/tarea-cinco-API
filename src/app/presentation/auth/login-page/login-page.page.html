<ion-content class="ion-padding">
  
  <div class="header-logo ion-text-center">
    <div class="shield-icon">
      <ion-icon name="shield-checkmark" color="primary"></ion-icon> 
    </div>
    <h1>Inicio de Sesión</h1>
  </div>

  <form [formGroup]="formularioLogin" (ngSubmit)="ingresar()">

    <div class="input-group">
      <label>Correo electrónico</label>
      <ion-item lines="none" class="custom-input" [ngClass]="{'error-border': correoInvalido}">
        <ion-input 
          formControlName="correoElectronico" 
          type="email" 
          placeholder="Ingrese su correo">
        </ion-input>
      </ion-item>
      
      <span class="error-msg" *ngIf="correoInvalido">
        <span *ngIf="correoControl?.errors?.['required']">El correo es requerido.</span>
        <span *ngIf="correoControl?.errors?.['email']">El correo es inválido.</span>
      </span>
    </div>

    <div class="input-group">
      <label>Contraseña</label>
      <ion-item lines="none" class="custom-input" [ngClass]="{'error-border': contrasenaInvalida}">
        <ion-input 
          formControlName="contrasena" 
          type="password" 
          placeholder="Ingrese su contraseña">
          <ion-icon slot="end" name="eye-off-outline"></ion-icon>
        </ion-input>
      </ion-item>
      <span class="error-msg" *ngIf="contrasenaInvalida">La contraseña es requerida.</span>
    </div>

    <div class="forgot-pass ion-text-end">
      <a (click)="abrirModalRecuperar()">Olvidaste tu contraseña</a>
    </div>

    <ion-button 
      expand="block" 
      type="submit" 
      class="btn-primary" 
      [disabled]="formularioLogin.invalid">
      Ingresar
    </ion-button>

  </form>
</ion-content>

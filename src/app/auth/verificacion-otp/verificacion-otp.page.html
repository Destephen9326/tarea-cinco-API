<ion-header [translucent]="true" class="modern-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/registro" text="" class="back-button"></ion-back-button>
    </ion-buttons>
    <ion-title class="header-title">Verificación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="otp-content">
  
 
  <div class="background-decoration">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>

  <div class="otp-container">
    

    <div class="header-section">
      <div class="icon-wrapper">
        <div class="icon-glow"></div>
        <ion-icon name="shield-checkmark" class="main-icon"></ion-icon>
        <div class="icon-ring"></div>
      </div>
      
      <h1 class="main-title">Verifica tu número</h1>
      
      <div class="info-card" *ngIf="numeroTelefono">
        <div class="info-icon">
          <ion-icon name="phone-portrait"></ion-icon>
        </div>
        <div class="info-content">
          <p class="info-label">Código enviado a</p>
          <p class="phone-number">{{numeroTelefono}}</p>
        </div>
      </div>
      
      <p class="subtitle" *ngIf="!numeroTelefono">
        Hemos enviado un código de <strong>{{MIN_LENGTH_TOKEN}} dígitos</strong> a tu teléfono
      </p>
    </div>

  
    <form [formGroup]="formularioOtp" (ngSubmit)="verificarToken()" class="form-section">
      
     
      <div class="input-wrapper">
        <div class="otp-label">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <span>Código de verificación</span>
        </div>
        
        <ion-item 
          [ngClass]="{
            'error-border': tokenInvalido, 
            'success-border': formularioOtp.get('tokenVerificacion')?.valid && formularioOtp.get('tokenVerificacion')?.touched,
            'focused': formularioOtp.get('tokenVerificacion')?.value?.length > 0
          }" 
          class="otp-input-item"
          lines="none"
        >
          <ion-input
            type="text"
            inputmode="numeric"
            formControlName="tokenVerificacion"
            placeholder="000000"
            maxlength="6"
            class="otp-input"
            autocomplete="one-time-code"
          ></ion-input>
          <div class="input-indicator" *ngIf="formularioOtp.get('tokenVerificacion')?.valid && formularioOtp.get('tokenVerificacion')?.touched">
            <ion-icon name="checkmark-circle" class="success-check"></ion-icon>
          </div>
        </ion-item>
        
        <div class="error-message" *ngIf="tokenInvalido">
          <ion-icon name="alert-circle"></ion-icon>
          <span>{{ tokenErrores }}</span>
        </div>
      </div>

   
      <ion-button
        expand="block"
        type="submit"
        [disabled]="formularioOtp.invalid || isLoading"
        class="verify-button"
        shape="round"
      >
        <div class="button-content">
          <ion-icon name="checkmark-circle" slot="start" *ngIf="!isLoading" class="button-icon"></ion-icon>
          <ion-spinner name="crescent" *ngIf="isLoading" class="button-spinner"></ion-spinner>
          <span class="button-text" *ngIf="!isLoading">Verificar código</span>
          <span class="button-text" *ngIf="isLoading">Verificando...</span>
        </div>
        <div class="button-shine"></div>
      </ion-button>

    </form>

    <div class="resend-section">
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">o</span>
        <span class="divider-line"></span>
      </div>
      
      <p class="resend-text">¿No recibiste el código?</p>
      <ion-button 
        fill="clear" 
        class="resend-button"
        [disabled]="isLoading"
        (click)="reenviarCodigo()"
      >
        <ion-icon name="refresh" slot="start" *ngIf="!isLoading" class="resend-icon"></ion-icon>
        <ion-spinner name="crescent" *ngIf="isLoading" class="button-spinner-small"></ion-spinner>
        <span *ngIf="!isLoading">Reenviar código</span>
        <span *ngIf="isLoading">Reenviando...</span>
      </ion-button>
    </div>

  </div>
  
</ion-content>
